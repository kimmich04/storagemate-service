# api + worker + postgres chạy trên laptop (Docker Desktop + WSL 2)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: storagemate
      POSTGRES_PASSWORD: storagemate
      POSTGRES_DB: storagemate
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storagemate"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://storagemate:storagemate@postgres:5432/storagemate
    ports:
      - "8000:8000"
    volumes:
      - ./models:/code/models:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://storagemate:storagemate@postgres:5432/storagemate
    volumes:
      - ./models:/code/models:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
