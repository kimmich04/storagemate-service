name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: storagemate
          POSTGRES_PASSWORD: storagemate
          POSTGRES_DB: storagemate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U storagemate"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://storagemate:storagemate@localhost:5432/storagemate_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Cài thư viện
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
